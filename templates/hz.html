{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Steam Clone — Панель управления играми</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --d3-purple: #7c5cde;
            --d3-purple-hi: #a98ef7;
            --d3-purple-key: #5638b8;
            --d3-cyan: #22d3ee;
            --d3-cyan-key: #0e97b3;
            --d3-lime: #84cc16;
            --d3-lime-key: #4d7c0f;
            --d3-rose: #fb7185;
            --d3-rose-key: #c22945;
            --d3-ink: #efe9ff;
            --d3-ease: cubic-bezier(.22, 1, .36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: "Nunito", "Segoe UI", sans-serif;
            color: var(--d3-ink);
            background:
                radial-gradient(ellipse 75% 55% at 10% 0%, rgba(167, 139, 250, .30), transparent 60%),
                radial-gradient(ellipse 65% 50% at 100% 0%, rgba(103, 232, 249, .22), transparent 58%),
                radial-gradient(ellipse 55% 45% at 85% 95%, rgba(253, 186, 116, .18), transparent 60%),
                linear-gradient(180deg, #241d3d 0%, #1a1430 45%, #171226 100%);
            display: grid;
            place-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* парящие орбы */
        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 480px; height: 480px;
            left: -140px; top: -120px;
            background: radial-gradient(circle at 35% 35%, rgba(139, 108, 246, .5), transparent 70%);
            animation: orb-a 24s ease-in-out infinite alternate;
        }
        body::after {
            width: 560px; height: 560px;
            right: -180px; bottom: -160px;
            background: radial-gradient(circle at 60% 35%, rgba(34, 211, 238, .35), transparent 72%);
            animation: orb-b 30s ease-in-out infinite alternate;
        }

        .console {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            border-radius: 30px;
            background: linear-gradient(165deg, rgba(61, 50, 96, .65), rgba(36, 29, 61, .85));
            border: 1px solid rgba(139, 108, 246, .35);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, .12),
                inset 0 -20px 40px rgba(20, 12, 45, .5),
                0 30px 70px rgba(10, 5, 30, .6),
                0 0 60px rgba(124, 92, 222, .18);
            backdrop-filter: blur(22px);
            padding: 42px 40px 36px;
            text-align: center;
            animation: rise .6s var(--d3-ease);
        }

        .console__badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .18em;
            text-transform: uppercase;
            background: rgba(139, 108, 246, .18);
            border: 1px solid rgba(139, 108, 246, .4);
            color: #c4b5fd;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
        }
        .console__badge i { font-size: 10px; }

        .console h1 {
            font-family: "Outfit", sans-serif;
            font-size: clamp(30px, 5vw, 40px);
            font-weight: 900;
            letter-spacing: 2px;
            margin: 18px 0 8px;
            background: linear-gradient(120deg, #d8ccff 0%, #8b6cf6 45%, #22d3ee 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(124, 92, 222, .45));
        }

        .console p {
            color: #9d92c4;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 3D-кнопки-клавиши */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 28px;
        }

        .btn {
            --key: var(--d3-purple-key);
            --glow: rgba(124, 92, 222, .45);
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 18px;
            padding: 20px 18px;
            font-family: "Outfit", sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transform: translateZ(0);
            transition: transform .16s var(--d3-ease), box-shadow .16s var(--d3-ease), filter .2s;
        }
        .btn i { margin-right: 10px; font-size: 17px; }

        .btn-launch {
            background: linear-gradient(180deg, #b9ec58 0%, var(--d3-lime) 55%, #65a30d 100%);
            --key: var(--d3-lime-key);
            --glow: rgba(132, 204, 22, .5);
        }
        .btn-launch::after,
        .btn-stop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.35) 50%, transparent 68%);
            background-size: 220% 100%;
            background-position: -220% 0;
        }
        .btn-launch:hover::after, .btn-stop:hover::after { animation: shine .9s var(--d3-ease); }

        .btn-stop {
            background: linear-gradient(180deg, #fda4af 0%, var(--d3-rose) 55%, #e11d48 100%);
            --key: var(--d3-rose-key);
            --glow: rgba(244, 63, 94, .45);
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.06) saturate(1.1);
        }
        .btn:active {
            transform: translateY(3px);
        }
        .btn-launch:active { box-shadow: 0 1px 0 var(--key), 0 6px 14px var(--glow), inset 0 4px 12px rgba(20,40,0,.3) !important; }
        .btn-stop:active { box-shadow: 0 1px 0 var(--key), 0 6px 14px var(--glow), inset 0 4px 12px rgba(80,0,20,.35) !important; }

        .btn-launch {
            box-shadow:
                0 6px 0 var(--key),
                0 20px 40px var(--glow),
                inset 0 2px 0 rgba(255,255,255,.55),
                inset 0 -10px 18px rgba(40,80,0,.22);
            text-shadow: 0 2px 3px rgba(30,60,0,.4);
        }
        .btn-stop {
            box-shadow:
                0 6px 0 var(--key),
                0 20px 40px var(--glow),
                inset 0 2px 0 rgba(255,255,255,.45),
                inset 0 -10px 18px rgba(80,0,25,.28);
            text-shadow: 0 2px 3px rgba(90,0,25,.45);
        }

        /* индикатор статуса */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .06em;
            background: rgba(23, 18, 38, .8);
            border: 1px solid rgba(139, 108, 246, .35);
            box-shadow:
                inset 0 2px 6px rgba(0,0,0,.45),
                0 8px 20px rgba(10,5,30,.5);
            color: #9d92c4;
            transition: color .3s, border-color .3s, box-shadow .3s;
        }
        .status__dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, .8);
            animation: pulse 1.6s ease-in-out infinite;
        }
        .status--ok { color: #a3e635; border-color: rgba(132, 204, 22, .5); }
        .status--ok .status__dot { background: #a3e635; box-shadow: 0 0 14px rgba(163, 230, 53, .9); }
        .status--off { color: #fb7185; border-color: rgba(251, 113, 133, .5); }
        .status--off .status__dot { background: #fb7185; box-shadow: 0 0 14px rgba(251, 113, 133, .9); animation: none; }

        /* подсказка */
        .hint {
            margin-top: 22px;
            font-size: 12px;
            color: #71679a;
        }
        .hint code {
            font-family: "Consolas", monospace;
            background: rgba(139, 108, 246, .15);
            padding: 2px 8px;
            border-radius: 6px;
            color: #c4b5fd;
        }

        /* 3D-виньетка снизу */
        .console__glow {
            position: absolute;
            left: 50%;
            bottom: -30px;
            width: 70%;
            height: 60px;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(124, 92, 222, .5), transparent 70%);
            filter: blur(24px);
            z-index: -1;
        }

        @keyframes orb-a {
            from { transform: translate3d(0,0,0) scale(1); }
            to   { transform: translate3d(130px, 90px, 0) scale(1.15); }
        }
        @keyframes orb-b {
            from { transform: translate3d(0,0,0) scale(1); }
            to   { transform: translate3d(-140px, -100px, 0) scale(1.1); }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(26px) scale(.97); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(163, 230, 53, .5); }
            50%      { box-shadow: 0 0 0 7px rgba(163, 230, 53, 0); }
        }
        @keyframes shine {
            from { background-position: -220% 0; }
            to   { background-position: 220% 0; }
        }
    </style>
    <script type="text/javascript" src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>

    <main class="console">
        <span class="console__badge"><i class="fas fa-bolt"></i> Launcher API</span>
        <h1>УПРАВЛЕНИЕ ИГРОЙ</h1>
        <p>Запуск и остановка внешних <b>.exe</b> файлов напрямую через лаунчер Steam Clone.</p>

        <div class="btn-group">
            <button class="btn btn-launch" onclick="launchExecutable('notepad.exe')">
                <i class="fas fa-play"></i>Играть
            </button>
            <button class="btn btn-stop" onclick="stopExecutable()">
                <i class="fas fa-stop"></i>Закрыть игру
            </button>
        </div>

        <div id="connection-status" class="status">
            <span class="status__dot"></span>
            <span id="status-text">Подключение к лаунчеру…</span>
        </div>

        <div class="hint">
            Работает только внутри Steam Clone Launcher · мост <code>pyBridge</code>
        </div>

        <div class="console__glow"></div>
    </main>

    <script type="text/javascript">
        let pyBackend = null;

        document.addEventListener("DOMContentLoaded", function() {
            const statusBox = document.getElementById("connection-status");
            const statusText = document.getElementById("status-text");

            // Проверяем, запущена ли страница внутри Qt WebEngine лаунчера
            if (typeof qt !== 'undefined') {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    pyBackend = channel.objects.pyBridge;
                    statusBox.classList.add("status--ok");
                    statusText.innerText = "ЛАУНЧЕР ПОДКЛЮЧЁН";
                });
            } else {
                statusBox.classList.add("status--off");
                statusText.innerText = "ОБЫЧНЫЙ БРАУЗЕР — ЗАПУСК ИЗ ЛАУНЧЕРА";
            }
        });

        function launchExecutable(exePath) {
            if (pyBackend) {
                pyBackend.launchGamePath(exePath);
            } else {
                alert("Ошибка: Запуск игры возможен только через официальный лаунчер Steam Clone!");
            }
        }

        function stopExecutable() {
            if (pyBackend) {
                pyBackend.stopGame();
            }
        }
    </script>
</body>
</html>
